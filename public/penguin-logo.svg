<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Penguin body - warm grey/taupe to match the logo -->
  <ellipse cx="60" cy="80" rx="45" ry="70" fill="#6b635b"/>

  <!-- White belly -->
  <ellipse cx="60" cy="90" rx="28" ry="50" fill="#ffffff"/>

  <!-- Head -->
  <circle cx="60" cy="30" r="28" fill="#6b635b"/>

  <!-- Golden face patches (emperor penguin style) -->
  <ellipse cx="45" cy="28" rx="10" ry="14" fill="#d4a056"/>
  <ellipse cx="75" cy="28" rx="10" ry="14" fill="#d4a056"/>

  <!-- Beak -->
  <path d="M60 35 L55 48 L60 45 L65 48 Z" fill="#6b635b"/>

  <!-- Eye -->
  <circle cx="67" cy="28" r="3" fill="#ffffff"/>
  <circle cx="68" cy="27" r="1.5" fill="#333"/>

  <!-- Flippers -->
  <ellipse cx="20" cy="85" rx="12" ry="30" fill="#6b635b" transform="rotate(-15 20 85)"/>
  <ellipse cx="100" cy="85" rx="12" ry="30" fill="#6b635b" transform="rotate(15 100 85)"/>

  <!-- Feet -->
  <ellipse cx="45" cy="148" rx="12" ry="6" fill="#6b635b"/>
  <ellipse cx="75" cy="148" rx="12" ry="6" fill="#6b635b"/>

  <!-- The Egg - golden -->
  <ellipse cx="60" cy="138" rx="16" ry="20" fill="#d4a056"/>
  <ellipse cx="60" cy="135" rx="10" ry="12" fill="#e8b975" opacity="0.5"/>
</svg>